name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    timeout-minutes: 30
    name: Django API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Dummy values so settings.py can load; nothing here calls Cloudinary, email or OpenRouter.
    env:
      SECRET_KEY: ci-dummy-secret-key
      DEBUG: "False"
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-dummy
      OPENROUTER_API_KEY: ci-dummy
      CLOUDINARY_CLOUD_NAME: ci-dummy
      CLOUDINARY_API_KEY: ci-dummy
      CLOUDINARY_API_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Models match the migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply every migration to an empty SQLite database
        run: python manage.py migrate --noinput

  frontend:
    timeout-minutes: 30
    name: React app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (errors fail, warnings allowed)
        run: npm run lint
      - run: npm run build
